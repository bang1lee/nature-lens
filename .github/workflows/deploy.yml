name: Verify and deploy Nature Lens
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run typecheck:worker
      - run: npm run test:boundary
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:app
      - run: npm run test:cloud-auth
      - run: npm run test:guest
      - run: npm run test:beta
      - run: npm run test:otp
      - run: npm run test:member
      - run: npm run test:map
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /nature-lens
      - run: npm run test:production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
